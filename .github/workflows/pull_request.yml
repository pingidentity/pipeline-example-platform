name: Pull Request Validation
on:
  pull_request:
    branches:
      - qa
      - prod
    paths:
      - 'terraform/**'
      - 'scripts/**'
      - 'GNUmakefile'
      - '.github/**'
      - 'secretstemplate'
permissions:
  contents: read
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fmt:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: fmt-check
      run: |
        terraform fmt -recursive -check .

  lint:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: terraform-linters/setup-tflint@8093687ecc9dcbfa88d07c103ad4176739a7287e # v4.1.0
      name: Setup TFLint
      with:
        tflint_version: 0.64.0

    - name: tflint
      run: |
        _branch="${GITHUB_BASE_REF}"
        case "${_branch}" in
          "prod")
            _tfdir=terraform
            ;;
          "qa")
            _tfdir=terraform
            ;;
          *)
            echo "ERROR: Unknown target branch: ${_branch}"
            exit 1
        esac
        cd ${_tfdir}
        echo "***Running terraform lint***"
        tflint

  validate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [lint]
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
    - run: |-
        umask 077
        _secrets_file=$(mktemp)
        trap 'rm -f "${_secrets_file}"' EXIT
        printf '%s' "${TERRAFORM_ENV_BASE64}" | base64 -d > "${_secrets_file}"
        . "${_secrets_file}"
        _branch="${GITHUB_BASE_REF}"
        _tfdir=terraform
        export TF_VAR_pingone_environment_name="${_branch}"
        case "${_branch}" in
          "prod")
            _stateKey=${TF_VAR_tf_state_key_prefix}/prod/terraform.tfstate
            ;;
          "qa")
            _stateKey=${TF_VAR_tf_state_key_prefix}/qa/terraform.tfstate
            ;;
          *)
            echo "ERROR: Unknown target branch: ${_branch}"
            exit 1
        esac
        terraform -chdir="${_tfdir}" init -input=false \
          -backend-config="bucket=${TF_VAR_tf_state_bucket}" \
          -backend-config="region=${TF_VAR_tf_state_region}" \
          -backend-config="key=${_stateKey}"
        echo "***Running terraform validate***"
        terraform -chdir="${_tfdir}" validate
        
  trivy:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Trivy
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        scan-type: 'config'
        hide-progress: false
        exit-code: '1'


  tfplan:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
    - run: |-
        umask 077
        _secrets_file=$(mktemp)
        trap 'rm -f "${_secrets_file}"' EXIT
        printf '%s' "${TERRAFORM_ENV_BASE64}" | base64 -d > "${_secrets_file}"
        . "${_secrets_file}"
        _branch="${GITHUB_BASE_REF}"
        _tfdir=terraform
        export TF_VAR_pingone_environment_name="${_branch}"
        case "${_branch}" in
          "prod")
            _stateKey="${TF_VAR_tf_state_key_prefix}/prod/terraform.tfstate"
            ;;
          "qa")
            _stateKey="${TF_VAR_tf_state_key_prefix}/qa/terraform.tfstate"
            ;;
          *)
            echo "ERROR: Unknown target branch: ${_branch}"
            exit 1
        esac
        terraform -chdir="${_tfdir}" init -input=false \
          -backend-config="bucket=${TF_VAR_tf_state_bucket}" \
          -backend-config="region=${TF_VAR_tf_state_region}" \
          -backend-config="key=${_stateKey}"
        echo "***Running terraform plan***"
        terraform -chdir="${_tfdir}" plan -input=false