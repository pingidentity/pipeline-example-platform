name: Feature Deploy Push
on:
  push:
    branches:
      - '**'
    paths:
      - 'terraform/**'
      - 'scripts/**'
      - 'GNUmakefile'
      - '.github/**'
      - 'secretstemplate'
  create:
permissions:
  contents: read

jobs:
  fmt:
    if: ${{ github.event_name == 'push' || (github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref != '' && github.event.ref != 'qa' && github.event.ref != 'prod') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
    - name: fmt-check
      run: |
        terraform fmt -recursive -check .

  lint:
    if: ${{ github.event_name == 'push' || (github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref != '' && github.event.ref != 'qa' && github.event.ref != 'prod') }}
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: terraform-linters/setup-tflint@8093687ecc9dcbfa88d07c103ad4176739a7287e # v4.1.0
      name: Setup TFLint
      with:
        tflint_version: v0.64.0

    - name: tflint
      run: |
        echo "***Running terraform lint***"
        tflint --recursive

  validate:
    if: ${{ github.event_name == 'push' || (github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref != '' && github.event.ref != 'qa' && github.event.ref != 'prod') }}
    needs: [lint]
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
      EVENT_REF: ${{ github.event.ref || github.ref }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
    - run: |-
        umask 077
        _secrets_file=$(mktemp)
        trap 'rm -f "${_secrets_file}"' EXIT
        printf '%s' "${TERRAFORM_ENV_BASE64}" | base64 -d > "${_secrets_file}"
        . "${_secrets_file}"
        _tfdir=terraform
        _event_ref="${EVENT_REF:-${GITHUB_REF}}"
        _branch="${_event_ref#refs/heads/}"
        export TF_VAR_pingone_environment_name="${_branch}"
        case $_branch in
          prod)
            _stateKey="${TF_VAR_tf_state_key_prefix}/prod/terraform.tfstate"
            ;;
          qa)
            _stateKey="${TF_VAR_tf_state_key_prefix}/qa/terraform.tfstate"
            ;;
          *)
            _stateKey="${TF_VAR_tf_state_key_prefix}/dev/${_branch}/terraform.tfstate"
            ;;
        esac
        terraform -chdir="${_tfdir}" init -input=false \
          -backend-config="bucket=${TF_VAR_tf_state_bucket}" \
          -backend-config="region=${TF_VAR_tf_state_region}" \
          -backend-config="key=${_stateKey}"
        echo "***Running terraform validate***"
        terraform -chdir="${_tfdir}" validate
        
  deploy:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') && ((github.event_name == 'push' && github.ref_type == 'branch') || (github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref != '' && github.event.ref != 'qa' && github.event.ref != 'prod')) }}
    name: Deploy
    needs: [validate]
    concurrency:
      group: terraform-${{ github.event_name == 'create' && github.event.ref || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
      EVENT_REF: ${{ github.event.ref || github.ref }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
    - run: |-
        umask 077
        _secrets_file=$(mktemp)
        trap 'rm -f "${_secrets_file}"' EXIT
        printf '%s' "${TERRAFORM_ENV_BASE64}" | base64 -d > "${_secrets_file}"
        . "${_secrets_file}"
        _tfdir=terraform
        _event_ref="${EVENT_REF:-${GITHUB_REF}}"
        _branch="${_event_ref#refs/heads/}"
        export TF_VAR_pingone_environment_name="${_branch}"
        case $_branch in
          prod)
            _stateKey="${TF_VAR_tf_state_key_prefix}/prod/terraform.tfstate"
            ;;
          qa)
            _stateKey="${TF_VAR_tf_state_key_prefix}/qa/terraform.tfstate"
            ;;
          *)
            _stateKey="${TF_VAR_tf_state_key_prefix}/dev/${_branch}/terraform.tfstate"
            ;;
        esac
        terraform -chdir="${_tfdir}" init -input=false \
          -backend-config="bucket=${TF_VAR_tf_state_bucket}" \
          -backend-config="region=${TF_VAR_tf_state_region}" \
          -backend-config="key=${_stateKey}"
        echo "***Running terraform apply***"
        terraform -chdir="${_tfdir}" apply --auto-approve -input=false